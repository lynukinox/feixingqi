<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>云端飞行棋</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header>
      <div><p class="eyebrow">LOCAL BOARD GAME</p><h1>飞行棋</h1></div>
      <button id="restartBtn" class="ghost-btn">重新开始</button>
    </header>
    <section class="game-layout">
      <div class="board-wrap"><div id="board" class="board" aria-label="飞行棋棋盘"></div></div>
      <aside class="panel">
        <div class="turn-card"><p class="label">当前回合</p><h2 id="turnTitle">红方</h2><p id="status">点击掷骰子开始游戏</p></div>
        <div id="dice" class="dice" aria-label="骰子">?</div>
        <button id="rollBtn" class="roll-btn">掷骰子</button>
        <p class="hint">掷出 <b>6</b> 才能让飞机起飞；落在对手飞机上可将其撞回机场。连续掷出两个 6 会额外获得一次机会。</p>
        <div id="players" class="players"></div>
      </aside>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="game.js"></script>
</body>
</html>
